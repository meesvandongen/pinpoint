name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Validates every quest and location: schemas, length limits, languages, pins inside the area, files that exist.
      - run: pnpm run content
      - run: pnpm --filter pinpoint-core run typecheck
      - run: pnpm --filter pinpoint-core run test
      - run: pnpm --filter pinpoint-app run typecheck
      - run: pnpm --filter pinpoint-app run test
      - run: pnpm --filter pinpoint-app run build
      # Deployments happen in Cloudflare Workers Builds; CI never runs Wrangler.
